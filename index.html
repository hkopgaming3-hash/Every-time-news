<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Every Time News | Premium Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --red: #ed1c24; --black: #1a1a1a; --gray: #f8f9fa; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Roboto', sans-serif; background: #fff; color: #333; line-height: 1.5; }
        header { border-bottom: 3px solid var(--black); padding: 15px; text-align: center; position: sticky; top: 0; background: #fff; z-index: 100; }
        .logo { font-family: 'Lora', serif; font-size: 24px; font-weight: bold; text-transform: uppercase; }
        .logo span { color: var(--red); }
        .nav-bar { display: flex; overflow-x: auto; padding: 12px 5px; gap: 15px; border-bottom: 1px solid #eee; background: #fff; scrollbar-width: none; }
        .nav-bar::-webkit-scrollbar { display: none; }
        .nav-item { display: flex; flex-direction: column; align-items: center; min-width: 65px; cursor: pointer; transition: 0.3s; }
        .icon-circle { width: 42px; height: 42px; background: var(--gray); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; margin-bottom: 4px; border: 2px solid transparent; }
        .nav-item.active .icon-circle { border-color: var(--red); background: #fff; color: var(--red); }
        .nav-item span { font-size: 10px; font-weight: bold; text-transform: uppercase; color: #666; }
        .nav-item.active span { color: var(--red); }
        .main-container { max-width: 600px; margin: auto; padding: 15px; }
        .post-card { margin-bottom: 30px; border-bottom: 1px solid #eee; padding-bottom: 20px; }
        .badge { color: var(--red); font-weight: bold; font-size: 11px; text-transform: uppercase; }
        .post-title { font-family: 'Lora', serif; font-size: 20px; margin: 5px 0; color: #000; }
        .post-img { width: 100%; border-radius: 8px; margin: 10px 0; display: block; background: #eee; }
        .post-desc { color: #444; font-size: 15px; white-space: pre-wrap; }
        .post-time { font-size: 11px; color: #999; margin-top: 10px; }
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1000; justify-content:center; align-items:center; }
        .modal-content { background:#fff; padding:20px; width:90%; max-width:400px; border-radius:12px; max-height: 90vh; overflow-y: auto; }
        input, textarea, select { width:100%; padding:12px; margin:8px 0; border:1px solid #ddd; border-radius:6px; font-family: inherit; }
        .btn-pub { background:var(--red); color:#fff; border:none; padding:15px; width:100%; border-radius:6px; font-weight:bold; cursor:pointer; font-size:16px; }
        .btn-pub:disabled { background: #ccc; }
        footer { text-align: center; padding: 30px; background: #f4f4f4; margin-top: 20px; font-size: 12px; }
        .admin-btn { color: #aaa; text-decoration: none; display: block; margin-top: 10px; }
    </style>
</head>
<body>

<header>
    <div class="logo">EVERY TIME <span>NEWS</span></div>
</header>

<div class="nav-bar">
    <div class="nav-item active" onclick="filterData('All', this)"><div class="icon-circle">🏠</div><span>All</span></div>
    <div class="nav-item" onclick="filterData('Today', this)"><div class="icon-circle">📅</div><span>Today</span></div>
    <div class="nav-item" onclick="filterData('Yojana', this)"><div class="icon-circle">📜</div><span>Yojana</span></div>
    <div class="nav-item" onclick="filterData('Gaming', this)"><div class="icon-circle">🎮</div><span>Gaming</span></div>
    <div class="nav-item" onclick="filterData('Stock', this)"><div class="icon-circle">📈</div><span>Stock</span></div>
</div>

<div class="main-container" id="newsFeed">
    <p style="text-align:center; padding:50px;">Khabrein load ho rahi hain...</p>
</div>

<footer>
    <p>&copy; 2024 Every Time News</p>
    <a href="javascript:void(0)" class="admin-btn" onclick="openModal()">Admin Login</a>
</footer>

<div id="adminModal" class="modal">
    <div class="modal-content">
        <h3 id="formTitle">Admin Access</h3>
        <div id="loginSection">
            <input type="password" id="pass" placeholder="Enter Password">
            <button class="btn-pub" onclick="doLogin()">Login</button>
        </div>
        <div id="editorSection" style="display:none;">
            <select id="pCat">
                <option value="Today">Today News</option>
                <option value="Yojana">Govt. Yojana</option>
                <option value="Gaming">Gaming</option>
                <option value="Stock">Stock Info</option>
            </select>
            <input type="text" id="pTitle" placeholder="News Headline">
            <label style="font-size:11px; color:var(--red);">Select Photo (Compressed automatically)</label>
            <input type="file" id="pImg" accept="image/*">
            <textarea id="pDesc" rows="5" placeholder="Full Details..."></textarea>
            <button class="btn-pub" id="pubBtn" onclick="startPublish()">Publish Post</button>
        </div>
        <button onclick="closeModal()" style="margin-top:10px; border:none; background:none; width:100%; color:#999;">Close</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCMl-WRIcl4kNRAtc-N18sWgSsy0Ly0KoI",
        authDomain: "every-time-news-486a5.firebaseapp.com",
        projectId: "every-time-news-486a5",
        databaseURL: "https://every-time-news-486a5-default-rtdb.asia-southeast1.firebasedatabase.app",
        storageBucket: "every-time-news-486a5.firebasestorage.app",
        messagingSenderId: "703171090056",
        appId: "1:703171090056:web:90b4029618a5236310313d",
        measurementId: "G-JRDSL2464F"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app); // Analytics Setup Done
    const db = getDatabase(app);
    const postsRef = ref(db, 'posts/');

    let allPosts = [];

    onValue(postsRef, (snap) => {
        const data = snap.val();
        if (data) {
            allPosts = Object.keys(data).map(k => ({id: k, ...data[k]})).reverse();
            render(allPosts);
        } else {
            document.getElementById('newsFeed').innerHTML = "No News Found.";
        }
    });

    function render(data) {
        const feed = document.getElementById('newsFeed');
        feed.innerHTML = "";
        data.forEach(p => {
            feed.innerHTML += `
                <div class="post-card">
                    <span class="badge">${p.category}</span>
                    <h2 class="post-title">${p.title}</h2>
                    ${p.img ? `<img src="${p.img}" class="post-img">` : ''}
                    <p class="post-desc">${p.content}</p>
                    <div class="post-time">${p.date}</div>
                </div>`;
        });
    }

    window.startPublish = async () => {
        const t = document.getElementById('pTitle').value;
        const c = document.getElementById('pDesc').value;
        const cat = document.getElementById('pCat').value;
        const file = document.getElementById('pImg').files[0];
        const btn = document.getElementById('pubBtn');

        if(!t || !c || !file) return alert("Please fill everything!");
        btn.disabled = true; btn.innerText = "Compressing & Uploading...";

        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (ev) => {
            const img = new Image();
            img.src = ev.target.result;
            img.onload = async () => {
                const canvas = document.createElement('canvas');
                const MAX_WIDTH = 600;
                const scaleSize = MAX_WIDTH / img.width;
                canvas.width = MAX_WIDTH;
                canvas.height = img.height * scaleSize;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                const base64 = canvas.toDataURL('image/jpeg', 0.6); 

                try {
                    await push(postsRef, {
                        title: t, content: c, category: cat, img: base64,
                        date: new Date().toLocaleString('en-IN', {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'})
                    });
                    alert("Khabar Publish Ho Gayi!");
                    location.reload();
                } catch (err) {
                    alert("Error: " + err.message);
                    btn.disabled = false;
                }
            };
        };
    };

    window.filterData = (c, el) => {
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
        render(c === 'All' ? allPosts : allPosts.filter(p => p.category === c));
    };

    window.openModal = () => document.getElementById('adminModal').style.display = 'flex';
    window.closeModal = () => document.getElementById('adminModal').style.display = 'none';
    window.doLogin = () => {
        if(document.getElementById('pass').value === "Admin@123") {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('editorSection').style.display = 'block';
            document.getElementById('formTitle').innerText = "Create News Post";
        } else { alert("Wrong Password!"); }
    };
</script>
</body>
</html>
